name: Multi-Platform Release

# Trigger: push a semver tag (e.g. 1.0.2) or run manually
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      sign_macos:
        description: 'Sign and notarize macOS builds'
        type: boolean
        default: false

# ── Required GitHub Secrets ───────────────────────────────────────────────────
# MACOS_CERT_BASE64      base64-encoded Developer ID .p12
# MACOS_CERT_PASSWORD    password used when exporting the .p12
# APPLE_SIGNING_IDENTITY "Developer ID Application: Christian Benz (MC52ZBYMUT)"
# APPLE_ID               traaitt@gmail.com
# APPLE_TEAM_ID          MC52ZBYMUT
# APPLE_APP_PASSWORD     app-specific password for notarytool
# ─────────────────────────────────────────────────────────────────────────────

env:
  NODE_VERSION: '14.21.3'

jobs:
  # ── macOS Intel (x86_64) ────────────────────────────────────────────────────
  build-macos-x86_64:
    name: macOS x86_64 (Intel)
    runs-on: macos-15-intel
    env:
      MACOS_SIGNING_ENABLED: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.sign_macos == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Import cert BEFORE packaging so electron-builder can sign the .app bundle
      - name: Import signing certificate
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "$MACOS_CERT_BASE64" || -z "$MACOS_CERT_PASSWORD" ]]; then
            echo "::error::MACOS_CERT_BASE64 and MACOS_CERT_PASSWORD are required for signed macOS releases."
            exit 1
          fi

          KC="$RUNNER_TEMP/build.keychain"
          KC_PASS="ci-kc-$$"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"

          printf '%s' "$MACOS_CERT_BASE64" | tr -d ' \t\n\r' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          if [[ ! -s "$RUNNER_TEMP/cert.p12" ]]; then
            echo "::error::cert.p12 is empty — check MACOS_CERT_BASE64 secret encoding"
            exit 1
          fi

          security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12 -A
          security list-keychains -d user -s "$KC"
          security default-keychain -s "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          # Export CSC_LINK/CSC_KEY_PASSWORD for electron-builder
          echo "CSC_LINK=$RUNNER_TEMP/cert.p12" >> $GITHUB_ENV
          echo "CSC_KEY_PASSWORD=$MACOS_CERT_PASSWORD" >> $GITHUB_ENV
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> $GITHUB_ENV
          if [[ -n "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "CSC_NAME=$APPLE_SIGNING_IDENTITY" >> $GITHUB_ENV
          fi

      - name: Disable macOS signing
        if: env.MACOS_SIGNING_ENABLED != 'true'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV

      - name: Build
        run: yarn build

      - name: Package macOS x86_64
        run: yarn package-mac-x86_64

      - name: Notarize + Staple
        if: env.MACOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "::error::APPLE_ID, APPLE_TEAM_ID, and APPLE_APP_PASSWORD are required for notarization."
            exit 1
          fi

          shopt -s nullglob
          dmgs=(release/*.dmg)
          if (( ${#dmgs[@]} == 0 )); then
            echo "::error::No macOS DMG found in release/ for notarization."
            exit 1
          fi

          for DMG in "${dmgs[@]}"; do
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
          done

      - name: Generate checksum
        run: |
          shopt -s nullglob
          files=(release/*.dmg)
          if (( ${#files[@]} == 0 )); then
            echo "No macOS DMG found in release/"
            exit 1
          fi
          shasum -a 256 "${files[@]}" > release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          if-no-files-found: error
          path: |
            release/*.dmg
            release/SHA256SUMS.txt

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Package Windows
        run: yarn package-win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem release\*.exe -ErrorAction SilentlyContinue
          if (-not $files) {
            throw "No Windows installer found in release/"
          }
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 release\SHA256SUMS.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS.txt

  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libxss1 libnss3 libasound2 libgbm1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Package Linux x86_64
        run: yarn package-linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksum
        run: |
          shopt -s nullglob
          files=(release/*.AppImage)
          if (( ${#files[@]} == 0 )); then
            echo "No Linux x86_64 AppImage found in release/"
            exit 1
          fi
          sha256sum "${files[@]}" > release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt

  # ── Linux ARM64 ─────────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libxss1 libnss3 libasound2 libgbm1

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Package Linux ARM64
        run: yarn package-linux-arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Generate checksum
        run: |
          shopt -s nullglob
          files=(release/*.AppImage)
          if (( ${#files[@]} == 0 )); then
            echo "No Linux ARM64 AppImage found in release/"
            exit 1
          fi
          sha256sum "${files[@]}" > release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/SHA256SUMS.txt

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish Release
    needs:
      - build-macos-x86_64
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate checksums
        run: |
          if ! find artifacts -mindepth 2 -name SHA256SUMS.txt -print -quit | grep -q .; then
            echo "No checksum files downloaded"
            exit 1
          fi
          find artifacts -mindepth 2 -name SHA256SUMS.txt -exec cat {} + | sort -u > artifacts/SHA256SUMS.txt

      - name: Build release notes
        run: |
          VERSION="${{ github.ref_name }}"
          CHECKSUMS=$(cat artifacts/SHA256SUMS.txt 2>/dev/null || echo "unavailable")
          cat > release_body.md << RELEASE_EOF
          ## traaittEnterprise XTE ${VERSION} — $(date -u '+%B %d, %Y')

          Desktop wallet for the **traaitt [XTE]** network.
          Node: \`main.trrxitte.com:443\` (SSL)

          ---

          ### Downloads

          | Artifact | Platform |
          |----------|----------|
          | \`*.dmg\` | macOS Intel |
          | \`*Setup*.exe\` | Windows x86_64 |
          | \`*x86_64.AppImage\` | Linux x86_64 |
          | \`*arm64.AppImage\` | Linux ARM64 |

          ---

          ### SHA256 Checksums

          \`\`\`
          ${CHECKSUMS}
          \`\`\`
          RELEASE_EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          generate_release_notes: false
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/SHA256SUMS.txt
